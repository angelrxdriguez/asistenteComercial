<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Comercial IA</title>
    <style>
       
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app" role="application">
        <header>
            <h1>Asistente Comercial</h1>
            <p>Describe las necesidades del cliente y la IA te recomendar� el mejor producto disponible.</p>
        </header>

        <section id="message-list" aria-live="polite" aria-label="Historial de conversación"></section>

        <form id="chat-form" autocomplete="off">
            <label class="sr-only" for="chat-input">Mensaje</label>
            <textarea id="chat-input" name="message" placeholder="Escribe..." required></textarea>
            <button type="submit">Enviar</button>
        </form>
        <div class="status" id="status"></div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
