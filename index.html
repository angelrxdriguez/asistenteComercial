<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Comercial IA</title>
    <style>
        :root {
            color-scheme: only light;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: clamp(16px, 4vw, 32px);
            background-color: #f6f4ec;
            color: #10180e;
        }

        main.app {
            width: min(960px, 100%);
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: clamp(20px, 3vw, 28px);
            border-radius: 24px;
            background-color: rgba(255, 255, 255, 0.82);
            box-shadow: 0 20px 40px rgba(133, 114, 94, 0.18);
            border: 1px solid rgba(122, 118, 23, 0.14);
            position: relative;
            overflow: hidden;
        }

        main.app::after {
            content: '';
            position: absolute;
            inset: 12px;
            border-radius: 20px;
            border: 1px dashed rgba(122, 118, 23, 0.22);
            pointer-events: none;
        }

        header {
            position: relative;
            background-color: #85725e;
            color: #ffffff;
            padding: 18px 22px;
            border-radius: 18px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        }

        header h1 {
            margin: 0 0 6px 0;
            font-size: clamp(1.8rem, 2vw + 1rem, 2.4rem);
            letter-spacing: 0.5px;
        }

        header p {
            margin: 0;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.86);
        }

        #message-list {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-right: 6px;
            max-height: min(70vh, 640px);
            overflow-y: auto;
            scrollbar-width: thin;
        }

        #message-list::-webkit-scrollbar {
            width: 8px;
        }

        #message-list::-webkit-scrollbar-thumb {
            background-color: rgba(122, 118, 23, 0.45);
            border-radius: 999px;
        }

        .bubble {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 18px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            transition: transform 140ms ease;
        }

        .bubble.user {
            align-self: flex-end;
            background-color: #7a7617;
            color: #ffffff;
            box-shadow: 0 12px 28px rgba(122, 118, 23, 0.25);
        }

        .bubble.ai {
            align-self: flex-start;
            background-color: #f6f4ec;
            border: 1px solid rgba(122, 118, 23, 0.18);
            box-shadow: 0 12px 22px rgba(60, 58, 52, 0.1);
        }

        .bubble.loading {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 18px;
        }

        .bubble.loading span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(122, 118, 23, 0.75);
            animation: typingDots 1.1s infinite ease-in-out;
        }

        .bubble.loading span:nth-child(2) {
            animation-delay: 0.18s;
        }

        .bubble.loading span:nth-child(3) {
            animation-delay: 0.36s;
        }

        @keyframes typingDots {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
            40% { transform: translateY(-6px); opacity: 1; }
        }

        form#chat-form {
            display: flex;
            gap: 14px;
            align-items: flex-end;
            padding-top: 12px;
            border-top: 1px solid rgba(122, 118, 23, 0.18);
        }

        textarea {
            flex: 1;
            min-height: 64px;
            max-height: 180px;
            padding: 16px 18px;
            border-radius: 18px;
            border: 1px solid rgba(122, 118, 23, 0.4);
            resize: vertical;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.9);
            color: inherit;
            transition: border 160ms ease, box-shadow 160ms ease;
        }

        textarea:focus {
            outline: none;
            border-color: #7a7617;
            box-shadow: 0 0 0 3px rgba(122, 118, 23, 0.2);
        }

        button {
            padding: 16px 28px;
            border-radius: 18px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background-color: #7a7617;
            color: #ffffff;
            box-shadow: 0 14px 30px rgba(122, 118, 23, 0.35);
            transition: transform 140ms ease, box-shadow 160ms ease, filter 140ms ease;
        }

        button:disabled {
            opacity: 0.6;
            cursor: progress;
            transform: none;
            box-shadow: none;
        }

        button:not(:disabled):hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }

        button:not(:disabled):active {
            transform: scale(0.97);
            filter: brightness(0.95);
        }

        .status {
            font-size: 0.9rem;
            color: rgba(60, 58, 52, 0.72);
            min-height: 1.2em;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 680px) {
            main.app {
                padding: 20px 18px;
            }

            header {
                padding: 16px 18px;
            }

            #message-list {
                max-height: 60vh;
            }

            button {
                padding: 14px 22px;
            }
        }
    </style>
</head>
<body>
    <main class="app" role="application">
        <header>
            <h1>Asistente Comercial</h1>
            <p>Describe las necesidades del cliente y la IA te recomendará el mejor producto disponible.</p>
        </header>

        <section id="message-list" aria-live="polite" aria-label="Historial de conversación"></section>

        <form id="chat-form" autocomplete="off">
            <label class="sr-only" for="chat-input">Mensaje</label>
            <textarea id="chat-input" name="message" placeholder="Ejemplo: Necesito rosas blancas para una boda" required></textarea>
            <button type="submit">Enviar</button>
        </form>
        <div class="status" id="status"></div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
