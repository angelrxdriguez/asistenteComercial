<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Comercial IA</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: stretch;
            min-height: 100vh;
            background: radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 55%),
                        radial-gradient(circle at bottom, rgba(56, 178, 172, 0.14), transparent 50%),
                        #0b141e;
            color: #f2f6f9;
        }

        main.app {
            position: relative;
            margin: clamp(16px, 3vw, 32px);
            padding: clamp(20px, 3vw, 28px);
            width: min(900px, 95vw);
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: rgba(12, 22, 32, 0.92);
            border: 1px solid rgba(148, 210, 255, 0.12);
            border-radius: 22px;
            box-shadow: 0 22px 48px rgba(4, 9, 18, 0.65);
            overflow: hidden;
        }

        main.app::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.18), rgba(56, 178, 172, 0.12));
            opacity: 0.35;
            pointer-events: none;
        }

        header {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1;
        }

        header h1 {
            margin: 0;
            font-size: clamp(1.6rem, 2vw + 1rem, 2.35rem);
        }

        header p {
            margin: 0;
            color: #9fb6c9;
        }

        #message-list {
            position: relative;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 4px 8px 4px 0;
            scrollbar-width: thin;
            z-index: 1;
        }

        #message-list::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(148, 210, 255, 0.06), transparent 16%, transparent 84%, rgba(57, 94, 120, 0.08));
            pointer-events: none;
        }

        .bubble {
            position: relative;
            max-width: 82%;
            padding: 16px 20px;
            border-radius: 18px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            backdrop-filter: blur(2px);
            transition: transform 140ms ease;
        }

        .bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.95), rgba(63, 173, 255, 0.82));
            box-shadow: 0 10px 28px rgba(59, 130, 246, 0.35);
        }

        .bubble.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 26px rgba(9, 19, 30, 0.45);
        }

        .bubble.loading {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
        }

        .bubble.loading span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.75);
            animation: typingDots 1.1s infinite ease-in-out;
        }

        .bubble.loading span:nth-child(2) {
            animation-delay: 0.18s;
        }

        .bubble.loading span:nth-child(3) {
            animation-delay: 0.36s;
        }

        @keyframes typingDots {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
            40% { transform: translateY(-6px); opacity: 1; }
        }

        form#chat-form {
            position: relative;
            display: flex;
            gap: 14px;
            align-items: flex-end;
            padding-top: 8px;
            z-index: 1;
        }

        textarea {
            flex: 1;
            min-height: 60px;
            max-height: 168px;
            padding: 16px 18px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            resize: vertical;
            font-size: 16px;
            background: rgba(11, 20, 30, 0.72);
            color: inherit;
            transition: border 160ms ease, box-shadow 160ms ease;
        }

        textarea:focus {
            outline: none;
            border-color: rgba(86, 195, 255, 0.65);
            box-shadow: 0 0 0 3px rgba(56, 178, 172, 0.25);
        }

        button {
            padding: 16px 28px;
            border-radius: 18px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 160ms ease;
            background: linear-gradient(135deg, #38b2ac, #2c7a7b);
            color: #f7fafc;
            box-shadow: 0 14px 32px rgba(44, 122, 123, 0.45);
        }

        button:disabled {
            cursor: progress;
            opacity: 0.6;
            transform: none;
            box-shadow: none;
        }

        button:not(:disabled):hover {
            transform: translateY(-1px);
        }

        button:not(:disabled):active {
            transform: scale(0.97);
            box-shadow: 0 8px 20px rgba(56, 178, 172, 0.45);
        }

        .status {
            position: relative;
            font-size: 0.85rem;
            color: #88a0b3;
            min-height: 1.2em;
            z-index: 1;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <main class="app" role="application">
        <header>
            <h1>Asistente Comercial</h1>
            <p>Describe las necesidades del cliente y la IA te recomendará el mejor producto disponible.</p>
        </header>

        <section id="message-list" aria-live="polite" aria-label="Historial de conversación"></section>

        <form id="chat-form" autocomplete="off">
            <label class="sr-only" for="chat-input">Mensaje</label>
            <textarea id="chat-input" name="message" placeholder="Ejemplo: Necesito rosas blancas para una boda" required></textarea>
            <button type="submit">Enviar</button>
        </form>
        <div class="status" id="status"></div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
